<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings & Profile | TourisMetrics AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="global-navbar"></div>

  <!-- Header Banner -->
  <section class="bg-primary text-white py-4" style="background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);">
    <div class="container">
      <div class="d-flex align-items-center gap-3">
        <div class="metric-icon-box bg-white text-primary rounded-circle" style="width: 55px; height: 55px;">
          <i class="fa-solid fa-user-circle fa-2x"></i>
        </div>
        <div>
          <h3 class="fw-bold mb-0" id="profile-banner-name">Alex Johnson</h3>
          <p class="text-white-50 mb-0" id="profile-banner-email">alex.traveler@gmail.com • Verified Tourist Account</p>
        </div>
      </div>
    </div>
  </section>

  <main class="container my-4">

    <!-- Profile Nav Tabs -->
    <ul class="nav nav-pills mb-4 gap-2" id="profileTabs">
      <li class="nav-item">
        <button class="nav-link active rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tab-bookings">
          <i class="fa-solid fa-suitcase-rolling me-1"></i> My Bookings & Itineraries
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tab-wishlist">
          <i class="fa-solid fa-heart me-1 text-danger"></i> Saved Wishlist
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tab-settings">
          <i class="fa-solid fa-gear me-1"></i> Traveler Preferences
        </button>
      </li>
    </ul>

    <div class="tab-content">
      
      <!-- TAB 1: My Bookings -->
      <div class="tab-pane fade show active" id="tab-bookings">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0">Active & Confirmed Trip Itineraries</h5>
          <span class="badge bg-light text-dark border" id="bookings-count-label">0 Bookings Found</span>
        </div>
        <div id="bookings-list-container">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- TAB 2: Wishlist -->
      <div class="tab-pane fade" id="tab-wishlist">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0">Saved Favorite Destinations</h5>
          <span class="badge bg-light text-dark border" id="wishlist-count-label">0 Places Saved</span>
        </div>
        <div class="row g-4" id="wishlist-grid-container">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- TAB 3: Preferences & Profile Settings -->
      <div class="tab-pane fade" id="tab-settings">
        <div class="p-4 bg-white border rounded-3 shadow-sm max-w-700">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-sliders text-primary me-2"></i>Traveler Profile & Safety Preferences</h5>
          <form onsubmit="saveProfileSettings(event)">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fs-7 fw-bold text-muted text-uppercase">Full Name</label>
                <input type="text" id="pref-name" class="form-control" value="Alex Johnson" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fs-7 fw-bold text-muted text-uppercase">Email Address</label>
                <input type="email" id="pref-email" class="form-control" value="alex.traveler@gmail.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fs-7 fw-bold text-muted text-uppercase">Home Base City</label>
                <input type="text" id="pref-city" class="form-control" value="Bangalore">
              </div>
              <div class="col-md-6">
                <label class="form-label fs-7 fw-bold text-muted text-uppercase">Emergency Contact Phone</label>
                <input type="text" id="pref-phone" class="form-control" value="+91 98765 43210">
              </div>
              <div class="col-md-6">
                <label class="form-label fs-7 fw-bold text-muted text-uppercase">Preferred Travel Style</label>
                <select id="pref-style" class="form-select">
                  <option value="Relaxed">Relaxed & Leisure</option>
                  <option value="Moderate" selected>Moderate Sightseeing</option>
                  <option value="Packed">Adventure & High Energy</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fs-7 fw-bold text-muted text-uppercase">Dietary Preference</label>
                <select id="pref-diet" class="form-select">
                  <option value="Any">All Cuisines</option>
                  <option value="Veg" selected>Pure Vegetarian</option>
                  <option value="Vegan">Vegan</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
              <i class="fa-solid fa-check me-1"></i> Save Preferences
            </button>
          </form>
        </div>
      </div>

    </div>

  </main>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    renderGlobalNav("bookings");

    function initProfilePage() {
      // Check hash
      if (window.location.hash === "#wishlist") {
        const tabTrigger = new bootstrap.Tab(document.querySelector('[data-bs-target="#tab-wishlist"]'));
        tabTrigger.show();
      }

      loadBookingsList();
      loadWishlistGrid();
    }

    function loadBookingsList() {
      const bookings = TravelState.getBookings();
      document.getElementById("bookings-count-label").textContent = `${bookings.length} Bookings / Saved Trips`;

      const c = document.getElementById("bookings-list-container");
      if (bookings.length === 0) {
        c.innerHTML = `
          <div class="p-5 bg-white rounded-3 border text-center text-muted">
            <i class="fa-solid fa-suitcase fa-3x mb-3 text-secondary"></i>
            <h5 class="fw-bold">No Bookings Yet</h5>
            <p>Generate an itinerary in the Smart Trip Planner or book a verified hotel stay.</p>
            <a href="trip_planner.html" class="btn btn-primary rounded-pill px-4">Plan A Trip Now</a>
          </div>
        `;
        return;
      }

      c.innerHTML = bookings.map((b, idx) => `
        <div class="p-4 bg-white border rounded-3 shadow-sm mb-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <div class="d-flex align-items-center gap-2 mb-1">
              <span class="badge bg-primary fs-7">${b.type || 'Trip'}</span>
              <span class="badge bg-success bg-opacity-10 text-success border border-success">${b.status || 'Confirmed'}</span>
              <span class="text-muted fs-7">Booking ID: <strong>${b.id}</strong></span>
            </div>
            <h5 class="fw-bold text-dark mb-1">${b.destination || b.hotel}</h5>
            <p class="text-muted fs-7 mb-0">
              ${b.days ? `${b.days} Days • ${b.travelers} Travelers • Hotel: ${b.hotel}` : `Check-In: ${b.check_in} to ${b.check_out} • ${b.rooms} Room(s)`}
            </p>
          </div>
          <div class="text-end">
            <span class="text-muted fs-7 d-block">Estimated Total</span>
            <h4 class="fw-bold text-primary mb-2">₹${b.estimated_total.toLocaleString()}</h4>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="window.print()">
                <i class="fa-solid fa-print me-1"></i> Print Voucher
              </button>
              <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="deleteBooking(${idx})">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function deleteBooking(idx) {
      if (!confirm("Are you sure you want to remove this trip voucher?")) return;
      let b = TravelState.getBookings();
      b.splice(idx, 1);
      localStorage.setItem("travel_bookings", JSON.stringify(b));
      loadBookingsList();
      TravelState.updateBadges();
      showToast("Booking removed.", "info");
    }

    async function loadWishlistGrid() {
      const wishlistIds = TravelState.getWishlist();
      document.getElementById("wishlist-count-label").textContent = `${wishlistIds.length} Saved Places`;

      const grid = document.getElementById("wishlist-grid-container");
      if (wishlistIds.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5 bg-white rounded-3 border">
            <i class="fa-solid fa-heart-crack fa-3x text-muted mb-3"></i>
            <h5 class="fw-bold">Your Wishlist is Empty</h5>
            <p class="text-muted">Click the heart icon on any destination card to save it here for future planning.</p>
            <a href="destinations.html" class="btn btn-primary rounded-pill px-4">Explore Destinations</a>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/destinations`);
        const allDests = await res.json();
        const saved = allDests.filter(d => wishlistIds.includes(d.id));

        grid.innerHTML = saved.map(d => `
          <div class="col-md-6 col-lg-4">
            <div class="travel-card">
              <div class="travel-card-img-wrap">
                <img src="${d.image}" class="travel-card-img">
                <span class="card-badge-top">${d.category}</span>
                <button class="wishlist-btn active" onclick="TravelState.toggleWishlist('${d.id}'); loadWishlistGrid();">
                  <i class="fa-solid fa-heart"></i>
                </button>
              </div>
              <div class="travel-card-body">
                <h5 class="fw-bold mb-1">${d.name}</h5>
                <span class="text-muted fs-7 mb-2 d-block"><i class="fa-solid fa-location-dot text-danger"></i> ${d.state}</span>
                <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-auto">
                  <strong class="text-primary">₹${d.avg_daily_cost.toLocaleString()} / day</strong>
                  <a href="trip_planner.html?dest=${d.id}" class="btn btn-sm btn-primary rounded-pill px-3">Plan Trip</a>
                </div>
              </div>
            </div>
          </div>
        `).join("");
      } catch (e) {
        console.error(e);
      }
    }

    function saveProfileSettings(e) {
      e.preventDefault();
      const user = {
        name: document.getElementById("pref-name").value,
        email: document.getElementById("pref-email").value,
        city: document.getElementById("pref-city").value,
        phone: document.getElementById("pref-phone").value,
        style: document.getElementById("pref-style").value,
        role: "tourist"
      };
      TravelState.setUser(user);
      document.getElementById("profile-banner-name").textContent = user.name;
      document.getElementById("profile-banner-email").textContent = `${user.email} • Verified Tourist Account`;
      showToast("Traveler preferences saved successfully!", "success");
    }

    initProfilePage();
  </script>
</body>
</html>
