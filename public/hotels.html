<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotels & Accommodation | TourisMetrics AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="global-navbar"></div>

  <!-- Header Banner -->
  <section class="bg-primary text-white py-4" style="background: linear-gradient(135deg, #1e3a8a 0%, #0d9488 100%);">
    <div class="container">
      <span class="badge bg-warning text-dark mb-1 fw-bold">Verified Stays & Resorts</span>
      <h2 class="fw-bold mb-1">Hotels & Accommodation Directory</h2>
      <p class="text-white-50 mb-0">Browse luxury heritage palaces, scenic hill cottages, and budget backpacker hostels near primary attractions.</p>
    </div>
  </section>

  <main class="container my-4">

    <!-- Filters Bar -->
    <div class="p-3 bg-white border rounded-3 shadow-sm mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <label class="fs-7 fw-bold text-muted text-uppercase">Destination:</label>
          <select id="hotel-dest-filter" class="form-select form-select-sm" onchange="loadHotels()">
            <option value="all">All Destinations</option>
            <option value="ooty">Ooty</option>
            <option value="manali">Manali</option>
            <option value="goa">Goa</option>
            <option value="jaipur">Jaipur</option>
            <option value="varanasi">Varanasi</option>
            <option value="munnar">Munnar</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="fs-7 fw-bold text-muted text-uppercase">Max Budget / Night:</label>
          <select id="hotel-price-filter" class="form-select form-select-sm" onchange="loadHotels()">
            <option value="999999">Any Price</option>
            <option value="2500">Under ₹2,500 (Budget Hostels)</option>
            <option value="5000">Under ₹5,000 (Comfort Resorts)</option>
            <option value="10000">Under ₹10,000 (Premium Luxury)</option>
          </select>
        </div>
        <div class="col-md-4">
          <span id="hotel-count-badge" class="badge bg-secondary p-2 w-100 fs-7 mt-3">Loading verified stays...</span>
        </div>
      </div>
    </div>

    <!-- Hotel Cards Grid -->
    <div class="row g-4" id="hotels-grid">
      <!-- Injected via JS -->
    </div>

  </main>

  <!-- Hotel Booking Modal -->
  <div class="modal fade" id="hotelBookingModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="booking-modal-title">Book Your Stay</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="hotel-booking-form" onsubmit="handleHotelBookingSubmit(event)">
            <input type="hidden" id="book-hotel-id">
            <input type="hidden" id="book-hotel-rate">

            <div class="mb-3">
              <label class="form-label fs-7 fw-bold text-muted text-uppercase">Guest Full Name</label>
              <input type="text" id="book-guest-name" class="form-control" value="Alex Johnson" required>
            </div>
            <div class="mb-3">
              <label class="form-label fs-7 fw-bold text-muted text-uppercase">Email Address for Voucher</label>
              <input type="email" id="book-guest-email" class="form-control" value="alex.traveler@gmail.com" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label fs-7 fw-bold text-muted text-uppercase">Check-In Date</label>
                <input type="date" id="book-check-in" class="form-control" value="2026-12-10" required onchange="calculateBookingTotal()">
              </div>
              <div class="col-6">
                <label class="form-label fs-7 fw-bold text-muted text-uppercase">Check-Out Date</label>
                <input type="date" id="book-check-out" class="form-control" value="2026-12-13" required onchange="calculateBookingTotal()">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fs-7 fw-bold text-muted text-uppercase">Rooms Required</label>
              <select id="book-rooms" class="form-select" onchange="calculateBookingTotal()">
                <option value="1" selected>1 Room (Up to 2 Adults)</option>
                <option value="2">2 Rooms (Family)</option>
                <option value="3">3 Rooms (Group)</option>
              </select>
            </div>

            <div class="p-3 bg-light rounded border mb-3 d-flex justify-content-between align-items-center">
              <div>
                <span class="text-muted fs-7 d-block">Estimated Total Payable</span>
                <span class="fs-7 text-muted" id="booking-nights-label">3 Nights • Free Cancellation</span>
              </div>
              <h4 class="fw-bold text-primary mb-0" id="booking-total-amount">₹0</h4>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">
              <i class="fa-solid fa-lock me-1"></i> Confirm & Generate Voucher
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    renderGlobalNav("hotels");

    let allHotels = [];
    let selectedHotel = null;

    async function loadHotels() {
      const dest = document.getElementById("hotel-dest-filter").value;
      const maxPrice = parseInt(document.getElementById("hotel-price-filter").value);

      try {
        const res = await fetch(`${API_BASE}/api/hotels?dest_id=${dest}&max_price=${maxPrice}`);
        allHotels = await res.json();

        document.getElementById("hotel-count-badge").textContent = `${allHotels.length} Verified Stays Available`;

        const grid = document.getElementById("hotels-grid");
        grid.innerHTML = allHotels.map(h => `
          <div class="col-md-6 col-lg-4">
            <div class="travel-card">
              <div class="travel-card-img-wrap">
                <img src="${h.image}" alt="${h.name}" class="travel-card-img">
                <span class="card-badge-top"><i class="fa-solid fa-star text-warning"></i> ${h.rating}</span>
                <span class="badge bg-success position-absolute bottom-0 end-0 m-2">${h.rooms_available} rooms left</span>
              </div>
              <div class="travel-card-body">
                <div class="text-muted fs-7 mb-1"><i class="fa-solid fa-location-dot text-danger"></i> ${h.distance_km} km from attractions</div>
                <h5 class="fw-bold mb-2">${h.name}</h5>
                <div class="d-flex flex-wrap gap-1 mb-3">
                  ${(h.amenities || []).map(a => `<span class="badge bg-light text-dark border fs-7">${a}</span>`).join("")}
                </div>
                <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-auto">
                  <div>
                    <span class="text-muted fs-7 d-block">Starting from</span>
                    <strong class="text-primary fs-5">₹${h.price_night.toLocaleString()}</strong> <span class="fs-7 text-muted">/ night</span>
                  </div>
                  <button class="btn btn-sm btn-primary rounded-pill px-3" onclick="openBookingModal('${h.id}')">
                    Book Now
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join("");

      } catch (err) {
        console.error(err);
      }
    }

    function openBookingModal(hotelId) {
      selectedHotel = allHotels.find(h => h.id === hotelId);
      if (!selectedHotel) return;

      document.getElementById("booking-modal-title").innerHTML = `<i class="fa-solid fa-hotel me-2"></i> Book: ${selectedHotel.name}`;
      document.getElementById("book-hotel-id").value = selectedHotel.id;
      document.getElementById("book-hotel-rate").value = selectedHotel.price_night;

      calculateBookingTotal();
      new bootstrap.Modal(document.getElementById("hotelBookingModal")).show();
    }

    function calculateBookingTotal() {
      if (!selectedHotel) return;
      const checkIn = new Date(document.getElementById("book-check-in").value);
      const checkOut = new Date(document.getElementById("book-check-out").value);
      const rooms = parseInt(document.getElementById("book-rooms").value) || 1;

      let nights = Math.max(Math.round((checkOut - checkIn) / (1000 * 60 * 60 * 24)), 1);
      const total = nights * selectedHotel.price_night * rooms;

      document.getElementById("booking-nights-label").textContent = `${nights} Night(s) • ${rooms} Room(s)`;
      document.getElementById("booking-total-amount").textContent = `₹${total.toLocaleString()}`;
      return total;
    }

    async function handleHotelBookingSubmit(e) {
      e.preventDefault();
      const totalAmt = calculateBookingTotal();
      const hotelId = document.getElementById("book-hotel-id").value;
      const guestName = document.getElementById("book-guest-name").value;
      const guestEmail = document.getElementById("book-guest-email").value;
      const checkIn = document.getElementById("book-check-in").value;
      const checkOut = document.getElementById("book-check-out").value;
      const rooms = parseInt(document.getElementById("book-rooms").value);

      try {
        const res = await fetch(`${API_BASE}/api/hotels/book`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            hotel_id: hotelId,
            guest_name: guestName,
            guest_email: guestEmail,
            check_in: checkIn,
            check_out: checkOut,
            rooms: rooms,
            total_amount: totalAmt
          })
        });

        const data = await res.json();
        if (data.success) {
          // Save in client state too
          TravelState.saveBooking({
            id: data.booking.booking_id,
            type: "Hotel Stay",
            hotel: selectedHotel.name,
            guest_name: guestName,
            check_in: checkIn,
            check_out: checkOut,
            rooms: rooms,
            estimated_total: totalAmt,
            saved_at: new Date().toLocaleDateString(),
            status: "Confirmed Voucher"
          });

          bootstrap.Modal.getInstance(document.getElementById("hotelBookingModal")).hide();
          showToast(`Booking Confirmed! ID: ${data.booking.booking_id}. Voucher saved to My Bookings.`, "success");
        }
      } catch (err) {
        showToast("Error processing booking.", "danger");
      }
    }

    loadHotels();
  </script>
</body>
</html>
