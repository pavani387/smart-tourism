<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Destinations | TourisMetrics AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="global-navbar"></div>

  <!-- Header Banner -->
  <section class="bg-primary text-white py-4" style="background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <span class="badge bg-warning text-dark mb-1 fw-bold">Curated Tourism Catalog</span>
          <h2 class="fw-bold mb-1">Explore Tourist Destinations</h2>
          <p class="text-white-50 mb-0">Browse by state, experience category, ticket entry charges, and seasonal suitability.</p>
        </div>
        <div>
          <a href="trip_planner.html" class="btn btn-light rounded-pill px-3 fw-bold text-primary shadow-sm">
            <i class="fa-solid fa-wand-magic-sparkles me-1"></i> Open Trip Planner
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Filter & Search Toolbar -->
  <div class="container my-4">
    <div class="p-3 bg-white border rounded-3 shadow-sm mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-lg-4 col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="text" id="dest-search" class="form-control border-start-0" placeholder="Search by destination, state, keyword..." oninput="filterDestinations()">
          </div>
        </div>
        <div class="col-lg-3 col-md-6">
          <select id="category-filter" class="form-select" onchange="filterDestinations()">
            <option value="All">All Categories</option>
            <option value="Hill Stations">Hill Stations</option>
            <option value="Beaches">Beaches & Coastal</option>
            <option value="Historical places">Historical & Heritage</option>
            <option value="Religious places">Religious & Spiritual</option>
            <option value="Adventure">Adventure & Sports</option>
            <option value="Nature and wildlife">Nature & Wildlife</option>
          </select>
        </div>
        <div class="col-lg-3 col-md-6">
          <select id="sort-filter" class="form-select" onchange="filterDestinations()">
            <option value="rating">Sort by Rating (Highest)</option>
            <option value="budget_asc">Daily Budget: Low to High</option>
            <option value="budget_desc">Daily Budget: High to Low</option>
            <option value="reviews">Most Reviewed</option>
          </select>
        </div>
        <div class="col-lg-2 col-md-6">
          <span id="dest-count-badge" class="badge bg-secondary p-2 w-100 fs-7">Loading places...</span>
        </div>
      </div>
    </div>

    <!-- Destinations Grid -->
    <div class="row g-4" id="destinations-grid">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- Destination Detail Modal -->
  <div class="modal fade" id="destModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title fw-bold" id="modal-dest-title">Destination Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="modal-dest-body">
          <!-- Dynamic Content -->
        </div>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    renderGlobalNav("destinations");

    let allDestinations = [];

    async function loadDestinations() {
      try {
        const res = await fetch(`${API_BASE}/api/destinations`);
        allDestinations = await res.json();
        
        // Check URL params for preselected category
        const params = new URLSearchParams(window.location.search);
        const cat = params.get("category");
        if (cat) {
          const sel = document.getElementById("category-filter");
          if (sel) sel.value = cat;
        }

        filterDestinations();
      } catch (e) {
        console.error(e);
      }
    }

    function filterDestinations() {
      const search = document.getElementById("dest-search").value.toLowerCase();
      const cat = document.getElementById("category-filter").value;
      const sort = document.getElementById("sort-filter").value;

      let filtered = allDestinations.filter(d => {
        const matchesSearch = d.name.toLowerCase().includes(search) || d.state.toLowerCase().includes(search) || d.description.toLowerCase().includes(search);
        const matchesCat = (cat === "All" || d.category.toLowerCase() === cat.toLowerCase());
        return matchesSearch && matchesCat;
      });

      // Sort
      if (sort === "rating") {
        filtered.sort((a, b) => b.rating - a.rating);
      } else if (sort === "budget_asc") {
        filtered.sort((a, b) => a.avg_daily_cost - b.avg_daily_cost);
      } else if (sort === "budget_desc") {
        filtered.sort((a, b) => b.avg_daily_cost - a.avg_daily_cost);
      } else if (sort === "reviews") {
        filtered.sort((a, b) => b.reviews_count - a.reviews_count);
      }

      document.getElementById("dest-count-badge").textContent = `${filtered.length} Destinations Available`;

      const grid = document.getElementById("destinations-grid");
      const wishlist = TravelState.getWishlist();

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="fa-solid fa-map-location-dot fa-3x text-muted mb-3"></i>
            <h5 class="fw-bold">No destinations found matching your criteria</h5>
            <p class="text-muted">Try resetting search keywords or selecting 'All Categories'.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(d => `
        <div class="col-md-6 col-lg-4">
          <div class="travel-card">
            <div class="travel-card-img-wrap">
              <img src="${d.image}" alt="${d.name}" class="travel-card-img">
              <span class="card-badge-top">${d.category}</span>
              <button class="wishlist-btn ${wishlist.includes(d.id) ? 'active' : ''}" onclick="event.stopPropagation(); TravelState.toggleWishlist('${d.id}'); this.classList.toggle('active');">
                <i class="fa-solid fa-heart"></i>
              </button>
            </div>
            <div class="travel-card-body">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="text-muted fs-7"><i class="fa-solid fa-location-dot text-danger"></i> ${d.state}, ${d.country}</span>
                <span class="badge bg-warning text-dark"><i class="fa-solid fa-star"></i> ${d.rating} (${d.reviews_count})</span>
              </div>
              <h5 class="fw-bold mb-1">${d.name}</h5>
              <p class="text-muted small mb-3 flex-grow-1">${d.description}</p>
              
              <div class="p-2 bg-light rounded border mb-3 fs-7">
                <div class="d-flex justify-content-between mb-1">
                  <span class="text-muted">Best Season:</span>
                  <strong class="text-dark">${d.best_season}</strong>
                </div>
                <div class="d-flex justify-content-between">
                  <span class="text-muted">Climate:</span>
                  <span>${d.climate}</span>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center border-top pt-2">
                <div>
                  <span class="text-muted fs-7 d-block">Est. Daily Budget</span>
                  <strong class="text-primary fs-6">₹${d.avg_daily_cost.toLocaleString()}</strong>
                </div>
                <div class="d-flex gap-1">
                  <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="openDestDetail('${d.id}')">
                    Details
                  </button>
                  <a href="trip_planner.html?dest=${d.id}" class="btn btn-sm btn-primary rounded-pill px-3">
                    Plan Trip
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join("");
    }

    function openDestDetail(id) {
      const d = allDestinations.find(x => x.id === id);
      if (!d) return;

      document.getElementById("modal-dest-title").innerHTML = `<i class="fa-solid fa-location-dot text-danger me-2"></i> ${d.name}`;
      
      let attractionsHtml = (d.attractions || []).map(a => `
        <div class="col-md-6">
          <div class="p-2 rounded border bg-light d-flex align-items-center gap-2">
            <img src="${a.image}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;">
            <div class="flex-grow-1 overflow-hidden">
              <strong class="fs-7 d-block text-truncate">${a.name}</strong>
              <div class="d-flex justify-content-between fs-7 text-muted">
                <span><i class="fa-solid fa-clock"></i> ~${a.time_hrs}h</span>
                <span>Entry: ${a.fee > 0 ? '₹' + a.fee : 'Free'}</span>
                <span>${a.indoor ? '<span class="badge bg-info text-dark">Indoor</span>' : '<span class="badge bg-secondary">Outdoor</span>'}</span>
              </div>
            </div>
          </div>
        </div>
      `).join("");

      document.getElementById("modal-dest-body").innerHTML = `
        <div class="row g-3 mb-3">
          <div class="col-md-5">
            <img src="${d.image}" class="img-fluid rounded-3 shadow-sm w-100" style="height: 220px; object-fit: cover;">
          </div>
          <div class="col-md-7">
            <span class="badge bg-primary mb-2">${d.category}</span>
            <p class="text-muted small">${d.description}</p>
            <div class="row g-2 fs-7">
              <div class="col-6"><strong>State:</strong> ${d.state}</div>
              <div class="col-6"><strong>Rating:</strong> ⭐ ${d.rating} / 5.0</div>
              <div class="col-6"><strong>Best Months:</strong> ${d.best_season}</div>
              <div class="col-6"><strong>Coordinates:</strong> ${d.lat}, ${d.lon}</div>
              <div class="col-6"><strong>Entry Charge:</strong> ${d.entry_fee > 0 ? '₹' + d.entry_fee : 'Free Entry'}</div>
              <div class="col-6"><strong>Est. Daily Cost:</strong> ₹${d.avg_daily_cost.toLocaleString()}</div>
            </div>
          </div>
        </div>

        <h6 class="fw-bold mb-2 border-top pt-3">Top Tourist Attractions & Highlights</h6>
        <div class="row g-2 mb-3">
          ${attractionsHtml}
        </div>

        <div class="d-flex justify-content-end gap-2 border-top pt-3">
          <a href="weather.html?dest=${d.id}" class="btn btn-outline-info btn-sm rounded-pill px-3">
            <i class="fa-solid fa-cloud-sun me-1"></i> Live Weather
          </a>
          <a href="maps.html?dest=${d.id}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="fa-solid fa-map-location-dot me-1"></i> View on Map
          </a>
          <a href="trip_planner.html?dest=${d.id}" class="btn btn-primary btn-sm rounded-pill px-4">
            <i class="fa-solid fa-wand-magic-sparkles me-1"></i> Generate Itinerary
          </a>
        </div>
      `;

      new bootstrap.Modal(document.getElementById("destModal")).show();
    }

    loadDestinations();
  </script>
</body>
</html>
